<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blazor Minimal App</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="BlazorMinimalApp.Client.styles.css" rel="stylesheet" />
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">
    <div id="app" class="min-h-screen">
        <div class="flex justify-center items-center h-screen">
            <div class="animate-spin rounded-full h-32 w-32 border-t-2 border-b-2 border-blue-500"></div>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden fixed bottom-0 w-full bg-red-600 text-white p-4">
        An unhandled error has occurred.
        <a href="" class="underline ml-2">Reload</a>
        <a class="dismiss float-right cursor-pointer">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
